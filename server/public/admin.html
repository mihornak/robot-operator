<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>ROBOT OPERATOR — ANALYTICS</title>
<!--
  Standalone ops dashboard, served by Hono at /admin. NOT part of the game's
  vite bundle: a PixiJS game on a bundle budget has no business shipping a
  table renderer. Everything is inline — markup, style, script — per repo
  rule 1 (self-contained bundle law): no CDN, no font URL, no import.

  The token is a bearer secret held in sessionStorage, so it dies with the tab.
  It never appears in a URL, which is why the CSV export is fetched as a blob
  instead of being a plain <a href>.
-->
<style>
  /* The game bundles VT323 at client/public/fonts/. In production the built
     client is served from the same origin root, so this resolves. In dev
     (vite on :5173, this page on :8790) it 404s and the stack below falls
     through to system mono — which is why every rule names a fallback. */
  @font-face {
    font-family: 'VT323';
    src: url('/fonts/VT323-Regular.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --amber: #ffb000;          /* AMBER     — client/src/render/util.ts */
    --amber-dim: #b87f00;      /* AMBER_DIM — ditto */
    --amber-hot: #ffd97a;      /* hover only — brighter than either bar tone */
    --amber-faint: rgba(255, 176, 0, 0.30);
    --amber-ghost: rgba(255, 176, 0, 0.10);
    --bg: #070502;
    --panel: rgba(255, 176, 0, 0.035);
    --stroke: rgba(255, 176, 0, 0.24);
    --crt: 'VT323', 'Courier New', monospace;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--amber);
  }

  body {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.45;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  /* Scanlines + a soft vignette. Kept faint: someone reads this to answer a
     question, and legibility beats theatre. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 176, 0, 0.045) 0px,
      rgba(255, 176, 0, 0.045) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
  }

  .crt { font-family: var(--crt); letter-spacing: 0.02em; }

  /* ---------------------------------------------------------------- chrome */

  .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 20px 60px; }

  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 1px solid var(--stroke);
    padding-bottom: 12px;
    margin-bottom: 18px;
  }

  h1 {
    font-family: var(--crt);
    font-size: 30px;
    line-height: 1;
    margin: 0;
    letter-spacing: 0.06em;
    text-shadow: 0 0 14px rgba(255, 176, 0, 0.35);
  }

  .subtitle {
    color: var(--amber-dim);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .ctl-label {
    font-family: var(--crt);
    font-size: 15px;
    color: var(--amber-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .ctl-label.dim { opacity: 0.72; font-size: 14px; }
  .ctl-label:empty { display: none; }

  button {
    font-family: var(--crt);
    font-size: 16px;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber-dim);
    background: transparent;
    border: 1px solid var(--stroke);
    padding: 6px 11px 4px;
    cursor: pointer;
  }
  button:hover { color: var(--amber); border-color: var(--amber-faint); background: var(--amber-ghost); }
  button:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
  button[aria-pressed='true'] {
    color: var(--bg);
    background: var(--amber);
    border-color: var(--amber);
  }
  button[disabled] { opacity: 0.4; cursor: default; }

  /* ---------------------------------------------------------------- panels */

  .panel {
    border: 1px solid var(--stroke);
    background: var(--panel);
    padding: 12px 14px 14px;
    margin-bottom: 14px;
  }

  .panel-title {
    font-family: var(--crt);
    font-size: 16px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 2px;
  }

  .panel-note {
    color: var(--amber-dim);
    font-size: 11px;
    letter-spacing: 0.04em;
    margin: 0 0 12px;
  }
  .panel-note + .panel-note { margin-top: -8px; }
  .panel-note.warn { color: var(--amber); }
  .panel-note:empty { display: none; }

  .panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .empty {
    color: var(--amber-dim);
    font-family: var(--crt);
    font-size: 17px;
    letter-spacing: 0.1em;
    padding: 18px 0;
    text-align: center;
  }

  .banner {
    border: 1px solid var(--amber);
    background: rgba(255, 176, 0, 0.09);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .banner b {
    font-family: var(--crt);
    font-size: 18px;
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 3px;
  }
  .banner span { color: var(--amber-dim); }

  /* ------------------------------------------------------------ stat tiles */

  .tiles {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  @media (max-width: 1000px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .tile {
    border: 1px solid var(--stroke);
    background: var(--panel);
    padding: 10px 12px 11px;
  }
  .tile-value {
    font-family: var(--crt);
    font-size: 40px;
    line-height: 0.95;
    text-shadow: 0 0 12px rgba(255, 176, 0, 0.3);
    font-variant-numeric: tabular-nums;
  }
  .tile-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin-top: 6px;
  }
  .tile-sub { font-size: 10px; color: var(--amber-dim); opacity: 0.8; margin-top: 2px; }

  /* ----------------------------------------------------------------- bars */

  .bars { display: flex; flex-direction: column; gap: 7px; position: relative; }

  .bar-row {
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr) 172px;
    align-items: center;
    gap: 10px;
  }
  .bar-row.indent .bar-label { padding-left: 12px; color: var(--amber-dim); }

  .bar-label {
    font-family: var(--crt);
    font-size: 16px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar-track {
    height: 18px;
    background: rgba(255, 176, 0, 0.06);
    border: 1px solid rgba(255, 176, 0, 0.12);
    position: relative;
  }
  .bar-fill { height: 100%; background: var(--amber); }
  .bar-fill.dim { background: var(--amber-dim); }
  .bar-fill.ghost { background: rgba(255, 176, 0, 0.42); }
  .bar-fill.hot { background: var(--amber-hot); }

  .bar-value {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-size: 12px;
  }
  .bar-value .pct { color: var(--amber-dim); }

  @media (max-width: 700px) {
    .bar-row { grid-template-columns: 96px minmax(0, 1fr) 132px; }
    .bar-label { font-size: 14px; }
  }

  /* ------------------------------------------------------------- timeseries */

  .chart { width: 100%; overflow-x: auto; position: relative; }
  .chart svg { display: block; width: 100%; height: auto; min-width: 420px; }
  .chart rect.hot { fill: var(--amber-hot); }
  .chart rect.hit { fill: transparent; }
  .chart text { font-family: var(--mono); fill: var(--amber-dim); font-size: 10px; }
  .chart .axis { stroke: var(--stroke); stroke-width: 1; }
  .chart .b-sessions { fill: var(--amber-dim); }
  .chart .b-signups { fill: var(--amber); }
  .chart .series-label {
    font-family: var(--crt); font-size: 13px; fill: var(--amber);
    letter-spacing: 0.12em; text-transform: uppercase;
  }

  /* -------------------------------------------------------------- tooltips */

  /* Ours, not the native `title` attribute: the browser sits on a title for
     about a second before showing it, which makes scrubbing across a month of
     bars useless. No transition — it must be there the instant you arrive. */
  .tip {
    position: absolute;
    z-index: 6;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 4px 9px 5px;
    background: #171006;
    border: 1px solid var(--amber);
    box-shadow: 0 0 14px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
  }
  .tip[hidden] { display: none; }
  .tip-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber-dim);
  }
  .tip-value {
    font-family: var(--crt);
    font-size: 17px;
    line-height: 1.1;
    letter-spacing: 0.04em;
    color: var(--amber-hot);
    font-variant-numeric: tabular-nums;
  }

  /* ---------------------------------------------------------------- tables */

  /* Long lists get their own scroll box so a 200-row signup list can't bury
     the panel below it. */
  .scroller { overflow: auto; max-height: 430px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { width: 1%; }          /* columns hug their content… */
  th.fill, td.fill { width: auto; } /* …and one trailing cell eats the slack. */
  th {
    text-align: left;
    font-family: var(--crt);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber-dim);
    border-bottom: 1px solid var(--stroke);
    padding: 5px 10px 3px;
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: #0f0a04;
    z-index: 1;
  }
  td {
    padding: 4px 10px;
    border-bottom: 1px solid rgba(255, 176, 0, 0.07);
    white-space: nowrap;
    font-size: 12px;
  }
  tr:hover td { background: var(--amber-ghost); }
  td.num, th.num { text-align: right; }
  td.dim { color: var(--amber-dim); }
  td.email { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }

  /* ------------------------------------------------------------------ gate */

  .gate {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .gate-card {
    width: 100%;
    max-width: 400px;
    border: 1px solid var(--stroke);
    background: var(--panel);
    padding: 22px;
  }
  .gate-card h1 { font-size: 26px; }
  .gate-card label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin: 18px 0 6px;
  }
  input[type='password'] {
    width: 100%;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--amber);
    background: rgba(255, 176, 0, 0.05);
    border: 1px solid var(--stroke);
    padding: 8px 10px;
  }
  input[type='password']:focus { outline: none; border-color: var(--amber); }
  .gate-card button { width: 100%; margin-top: 14px; padding: 9px; font-size: 18px; }
  .gate-msg { margin-top: 14px; font-size: 12px; line-height: 1.5; }
  .gate-msg b { font-family: var(--crt); font-size: 16px; letter-spacing: 0.08em; display: block; }
  .gate-msg span { color: var(--amber-dim); }

  .footnote {
    color: var(--amber-dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    margin-top: 24px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------ utils

  const TOKEN_KEY = 'ro.admin.token';
  const root = document.getElementById('root');

  /** Minimal element builder. Text always goes in via textContent — signup
   *  emails and robot names are user input and never touch innerHTML. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = String(v);
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return el;
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k === 'text') el.textContent = String(v);
      else el.setAttribute(k, String(v));
    }
    for (const kid of kids.flat()) if (kid) el.appendChild(kid);
    return el;
  }

  const num = (n) => (typeof n === 'number' && isFinite(n) ? n.toLocaleString('en-US') : '—');

  /** Percentages are null-safe on purpose: 0/0 is "no answer", not "0%". */
  const ratio = (a, b) => (typeof a === 'number' && typeof b === 'number' && b > 0 ? a / b : null);
  /** A rounded-to-zero share still isn't zero — say so rather than printing 0%. */
  const pct = (r, digits = 1) => {
    if (r == null) return '—';
    const v = r * 100;
    if (v > 0 && Number(v.toFixed(digits)) === 0) return `<${(1 / 10 ** digits).toFixed(digits)}%`;
    return `${v.toFixed(digits)}%`;
  };
  const pctOf = (a, b, digits = 1) => pct(ratio(a, b), digits);

  function fmtTs(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function fmtDay(day) {
    // Server sends 'YYYY-MM-DD'; show MM-DD on the axis.
    return typeof day === 'string' && day.length >= 10 ? day.slice(5) : String(day ?? '');
  }

  // -------------------------------------------------------------------- api

  class ApiError extends Error {
    constructor(kind, status) {
      super(kind);
      this.kind = kind;      // unauthorized | disabled | nodb | unreachable | bad
      this.status = status;
    }
  }

  /** Each status code means something different and they must never be
   *  collapsed into one "error" — see FAILURE_TEXT. 503 and 500 are the pair
   *  worth care: the server distinguishes "never configured" from "configured
   *  but not answering right now", and so does this page. */
  function classify(status) {
    if (status === 401 || status === 403) return 'unauthorized';
    if (status === 501) return 'disabled';
    if (status === 503) return 'nodb';
    if (status === 500 || status === 502 || status === 504) return 'dberror';
    return 'bad';
  }

  const FAILURE_TEXT = {
    unauthorized: ['TOKEN REJECTED', 'The server did not accept that admin token.'],
    disabled: ['ANALYTICS DISABLED', 'No ADMIN_TOKEN is configured on the service. Set ADMIN_TOKEN on the deployment and redeploy — until then there is no admin surface to log into.'],
    nodb: ['NO DATABASE CONNECTED', 'The service has no DATABASE_URL, so nothing has been recorded and there are no numbers to show. This is not zero traffic — it is no store at all.'],
    dberror: ['DATABASE NOT ANSWERING', 'A database is configured but the query failed — it is most likely paused or restarting. The data is not lost; try Refresh in a minute.'],
    unreachable: ['SERVER UNREACHABLE', 'The request never completed. Check the service is up.'],
    bad: ['REQUEST FAILED', 'The server returned an unexpected response.'],
  };

  /** Failures that still mean "your token is good" — the dashboard chrome opens
   *  so the operator can read the reason and hit Refresh, rather than being
   *  bounced back to a login box that has nothing to do with the problem. */
  const AUTHENTICATED_FAILURES = new Set(['nodb', 'dberror']);

  async function apiGet(path, token, as) {
    let res;
    try {
      res = await fetch(path, {
        headers: { Authorization: `Bearer ${token}`, Accept: as === 'blob' ? '*/*' : 'application/json' },
        cache: 'no-store',
      });
    } catch {
      throw new ApiError('unreachable', 0);
    }
    if (!res.ok) throw new ApiError(classify(res.status), res.status);
    if (as === 'blob') return res.blob();
    try {
      return await res.json();
    } catch {
      throw new ApiError('bad', res.status);
    }
  }

  const readToken = () => sessionStorage.getItem(TOKEN_KEY);
  const writeToken = (t) => sessionStorage.setItem(TOKEN_KEY, t);
  const clearToken = () => sessionStorage.removeItem(TOKEN_KEY);

  // ------------------------------------------------------------------- gate

  /** 'all' is expressed as a very large window; the server clamps it. */
  const WINDOWS = [
    { label: '7d', days: 7 },
    { label: '30d', days: 30 },
    { label: '90d', days: 90 },
    { label: 'all', days: 3650 },
  ];

  function renderGate(failure) {
    const input = h('input', { type: 'password', id: 'tok', autocomplete: 'off', placeholder: 'ADMIN_TOKEN' });
    const submit = h('button', { type: 'submit', text: 'Enter' });
    const msg = h('div', { class: 'gate-msg' });

    const setFailure = (kind) => {
      msg.textContent = '';
      if (!kind) return;
      const [title, body] = FAILURE_TEXT[kind] || FAILURE_TEXT.bad;
      msg.appendChild(h('b', { text: title }));
      msg.appendChild(h('span', { text: body }));
    };
    setFailure(failure);

    // A 501 is terminal: no token can work, so do not invite one.
    if (failure === 'disabled') { input.disabled = true; submit.disabled = true; }

    const form = h('form', {
      class: 'gate-card',
      onsubmit: async (e) => {
        e.preventDefault();
        const candidate = input.value.trim();
        if (!candidate) return;
        submit.disabled = true;
        submit.textContent = 'Checking…';
        try {
          await apiGet('/api/admin/overview?days=1', candidate);
          writeToken(candidate);
          renderDashboard(candidate);
        } catch (err) {
          const kind = err instanceof ApiError ? err.kind : 'unreachable';
          if (AUTHENTICATED_FAILURES.has(kind)) {
            // The token was accepted; it is the store that is missing or down.
            // Let them in — the dashboard says which, in full.
            writeToken(candidate);
            renderDashboard(candidate);
            return;
          }
          if (kind === 'unauthorized') clearToken();
          setFailure(kind);
          submit.disabled = kind === 'disabled';
          submit.textContent = 'Enter';
          input.disabled = kind === 'disabled';
        }
      },
    },
      h('h1', { class: 'crt', text: 'ROBOT OPERATOR' }),
      h('div', { class: 'subtitle', text: 'analytics · restricted' }),
      h('label', { for: 'tok', text: 'Admin token' }),
      input,
      submit,
      msg,
    );

    root.textContent = '';
    root.appendChild(h('div', { class: 'gate' }, form));
    if (!input.disabled) input.focus();
  }

  function signOut() {
    clearToken();
    renderGate(null);
  }

  // -------------------------------------------------------------- dashboard

  function renderDashboard(token) {
    const state = { days: 30, overview: null, sessions: null, signups: null, error: null, loading: true };

    const body = h('div');
    const daysButtons = WINDOWS.map((w) =>
      h('button', {
        type: 'button',
        text: w.label,
        'aria-pressed': String(state.days === w.days),
        onclick: () => {
          if (state.days === w.days) return;
          state.days = w.days;
          for (const b of daysButtons) b.setAttribute('aria-pressed', String(b.textContent === w.label));
          load();
        },
      }),
    );

    const refreshBtn = h('button', { type: 'button', text: 'Refresh', onclick: () => load() });

    // The server clamps the window, so "all" can come back as something else.
    // Report the window the numbers actually cover, not the button you pressed.
    const windowNote = h('span', { class: 'ctl-label dim' });

    const wrap = h('div', { class: 'wrap' },
      h('header', { class: 'top' },
        h('div', null,
          h('h1', { class: 'crt', text: 'ROBOT OPERATOR' }),
          h('div', { class: 'subtitle', text: 'analytics · who tried it, how far they got, did they sign up' }),
        ),
        h('div', { class: 'controls' },
          h('span', { class: 'ctl-label', text: 'window' }),
          daysButtons,
          windowNote,
          refreshBtn,
          h('button', { type: 'button', text: 'Sign out', onclick: signOut }),
        ),
      ),
      body,
      h('div', { class: 'footnote', text: 'read-only · token held in sessionStorage · closes with the tab' }),
    );

    root.textContent = '';
    root.appendChild(wrap);

    /** Any 401 anywhere means the token died — bail to the gate immediately. */
    function bounce(kind) {
      if (kind !== 'unauthorized') return false;
      clearToken();
      renderGate('unauthorized');
      return true;
    }

    async function load() {
      state.loading = true;
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Loading…';
      paint();

      const [ov, se, wl] = await Promise.allSettled([
        apiGet(`/api/admin/overview?days=${state.days}`, token),
        apiGet('/api/admin/sessions?limit=50', token),
        apiGet('/api/admin/wishlist?limit=200', token),
      ]);

      const kindOf = (r) => (r.reason instanceof ApiError ? r.reason.kind : 'unreachable');
      const settled = [ov, se, wl];
      const dead = settled.find((r) => r.status === 'rejected' && kindOf(r) === 'unauthorized');
      if (dead) { bounce('unauthorized'); return; }

      state.overview = ov.status === 'fulfilled' ? ov.value : null;
      state.sessions = se.status === 'fulfilled' ? se.value : null;
      state.signups = wl.status === 'fulfilled' ? wl.value : null;
      state.error = ov.status === 'rejected' ? kindOf(ov) : null;
      state.loading = false;
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'Refresh';
      const served = state.overview && typeof state.overview.days === 'number' ? state.overview.days : null;
      windowNote.textContent = served == null ? '' : `= ${served} days`;
      paint();
    }

    function paint() {
      body.textContent = '';

      if (state.loading && !state.overview) {
        body.appendChild(h('div', { class: 'panel' }, h('div', { class: 'empty', text: 'LOADING…' })));
        return;
      }

      // A failed overview is the whole page's story — say which failure it was
      // and render nothing else. Zeroes here would read as real traffic.
      if (state.error) {
        const [title, text] = FAILURE_TEXT[state.error] || FAILURE_TEXT.bad;
        body.appendChild(h('div', { class: 'banner' }, h('b', { text: title }), h('span', { text })));
        return;
      }

      const o = state.overview;
      if (!o) return;

      const emptyWindow = !o.sessions;
      if (emptyWindow) {
        body.appendChild(h('div', { class: 'banner' },
          h('b', { text: 'NO EVENTS IN THIS WINDOW' }),
          h('span', { text: 'The store is connected and reachable — it simply has no sessions in the selected period. Widen the window, or wait for someone to open the game.' }),
        ));
      }

      body.appendChild(tiles(o));
      body.appendChild(funnelPanel(o));
      body.appendChild(depthPanel(o));
      body.appendChild(dailyPanel(o));
      body.appendChild(sessionsPanel(state.sessions));
      body.appendChild(signupsPanel(state.signups, token, o));
    }

    // ------------------------------------------------------------- sections

    function tile(value, label, sub) {
      return h('div', { class: 'tile' },
        h('div', { class: 'tile-value', text: value }),
        h('div', { class: 'tile-label', text: label }),
        sub ? h('div', { class: 'tile-sub', text: sub }) : null,
      );
    }

    function tiles(o) {
      return h('div', { class: 'tiles' },
        tile(num(o.sessions), 'sessions', 'loaded the page'),
        tile(num(o.played), 'played', `${pctOf(o.played, o.sessions, 0)} of sessions`),
        tile(num(o.died), 'died', `${pctOf(o.died, o.played, 0)} of players`),
        tile(num(o.finished), 'finished', `${pctOf(o.finished, o.played, 0)} of players`),
        // "signups" counts players who completed the gate, which is not the same
        // as rows in the database — see the wishlist panel for the difference.
        tile(num(o.signups), 'signups', `entered an address · ${num(o.signupsAllTime)} all-time`),
        tile(o.conversionPct == null ? '—' : `${o.conversionPct.toFixed(1)}%`, 'conversion', 'of sessions that saw the gate'),
      );
    }

    /**
     * Instant hover readout for one plot. Deliberately not the native `title`
     * attribute: the browser sits on a title for about a second before showing
     * it, which makes scrubbing across a month of bars useless. One absolutely
     * positioned div, one show()/hide() pair, no rAF and no transition — the MCP
     * Chrome window throttles animation frames, and a readout must not depend on
     * one anyway.
     */
    function makeTip(plot) {
      const tip = h('div', { class: 'tip', hidden: true });
      plot.appendChild(tip);
      const api = {
        show(leftPx, topPx, transform, label, value) {
          tip.textContent = '';
          tip.appendChild(h('span', { class: 'tip-label', text: label }));
          tip.appendChild(h('span', { class: 'tip-value', text: value }));
          tip.style.left = `${leftPx}px`;
          tip.style.top = `${topPx}px`;
          tip.style.transform = transform;
          tip.hidden = false;
        },
        hide() { tip.hidden = true; },
      };
      plot.addEventListener('mouseleave', () => {
        api.hide();
        for (const el of plot.querySelectorAll('.hot')) el.classList.remove('hot');
      });
      return api;
    }

    function barRow(label, value, width, prevPct, opts) {
      opts = opts || {};
      const w = Math.max(0, Math.min(100, width));
      const fill = h('div', { class: `bar-fill${opts.tone ? ` ${opts.tone}` : ''}`, style: `width:${w}%` });
      const track = h('div', { class: 'bar-track' }, fill);
      const row = h('div', { class: `bar-row${opts.indent ? ' indent' : ''}` },
        h('div', { class: 'bar-label', text: label }),
        track,
        h('div', { class: 'bar-value' },
          h('span', { text: num(value) }),
          h('span', { class: 'pct', text: `  ${prevPct}` }),
        ),
      );

      // The whole row is the hit area, not the fill: a 1%-wide bar has to be as
      // easy to read as a full one, and a zero-length one still has a story.
      if (opts.tip) {
        row.addEventListener('mouseenter', () => {
          fill.classList.add('hot');
          // Anchor at the fill's leading edge, flipping inward once the bar is
          // long enough that the readout would run off the right side.
          const x = track.offsetLeft + (track.offsetWidth * w) / 100;
          // Measured against the track's right edge, not a fixed percentage, so
          // the readout flips only when it would actually run out of room.
          const flip = x + 250 > track.offsetLeft + track.offsetWidth;
          opts.tip.show(
            x,
            row.offsetTop + row.offsetHeight / 2,
            flip ? 'translate(calc(-100% - 10px), -50%)' : 'translate(10px, -50%)',
            opts.tipLabel,
            opts.tipValue,
          );
        });
        row.addEventListener('mouseleave', () => fill.classList.remove('hot'));
      }
      return row;
    }

    function funnelPanel(o) {
      const base = o.sessions || 0;
      const w = (n) => (base > 0 ? (100 * (n || 0)) / base : 0);

      const bars = h('div', { class: 'bars' });
      const tip = makeTip(bars);

      /**
       * A funnel must never widen. It can, in the data: `signups` counts
       * `wishlist_submit` while `sawGate` counts `wishlist_shown`, so a batch of
       * shown-events lost to a closing tab leaves a later step with a higher
       * count than the step above it. The bar is clamped to its predecessor and
       * the readout says so; the printed count stays exactly what the server
       * sent, because hiding the number would be the actual dishonesty.
       */
      let ceiling = 100;
      const step = (label, value, opts) => {
        const raw = w(value);
        const width = Math.min(raw, ceiling);
        const capped = raw > width + 0.05;
        // Branch rows (died/finished) are exits from "played", not steps of
        // their own, so they read against the ceiling without lowering it.
        if (!opts.branch) ceiling = width;
        // The row already prints the drop from the step above; the readout adds
        // the share of everyone who ever loaded, which the row does not show.
        const detail = opts.detail || `${num(value)} · ${pctOf(value, o.sessions, 0)} of all sessions`;
        return barRow(label, value, width, opts.prev, {
          indent: opts.branch,
          tone: opts.tone,
          tip,
          tipLabel: label,
          tipValue: capped ? `${detail} · bar capped to the step above` : detail,
        });
      };

      bars.appendChild(step('Loaded', o.sessions, { prev: base > 0 ? '100%' : '—' }));
      bars.appendChild(step('Booted', o.booted, { prev: pctOf(o.booted, o.sessions, 0) + ' of loaded' }));
      bars.appendChild(step('Played', o.played, { prev: pctOf(o.played, o.booted, 0) + ' of booted' }));
      bars.appendChild(step('Died', o.died, { prev: pctOf(o.died, o.played, 0) + ' of played', branch: true, tone: 'dim' }));
      bars.appendChild(step('Finished', o.finished, { prev: pctOf(o.finished, o.played, 0) + ' of played', branch: true, tone: 'dim' }));

      // `sawGate` is the real denominator of conversionPct — the sessions that
      // were actually shown the email gate. Without this step the funnel jumps
      // from died/finished straight to signed up and the conversion tile has no
      // visible basis. Guarded on presence so the page still renders against a
      // server that hasn't shipped the field yet.
      const sawGate = typeof o.sawGate === 'number' ? o.sawGate : null;
      if (sawGate != null) {
        bars.appendChild(step('Saw gate', sawGate, { prev: pctOf(sawGate, o.played, 0) + ' of played' }));
      }

      /**
       * The conversion rate is NOT recomputed from `signups / sawGate`. Those
       * two have different numerators on purpose: `signups` is every submit,
       * while `conversionPct` counts only submits that can be matched to a gate
       * view — the bounded, audited number, and the one the tile shows. Deriving
       * it here again would put two different figures for the same thing side by
       * side on one screen.
       */
      const conv = typeof o.conversionPct === 'number' ? o.conversionPct : null;
      bars.appendChild(step('Signed up', o.signups,
        conv != null
          ? {
              prev: `${conv.toFixed(0)}% converted`,
              detail: `${num(o.signups)} entered · ${conv.toFixed(1)}% of gate views converted`,
            }
          : sawGate != null
            ? { prev: '—' }
            : { prev: pctOf(o.signups, o.played, 0) + ' of played' },
      ));

      const notes = [
        h('p', { class: 'panel-note', text: 'Bar width is share of all sessions. The number on the right is the drop from the step above.' }),
      ];
      if (conv != null) {
        notes.push(h('p', {
          class: 'panel-note',
          text: 'SAW GATE counts sessions that reached an end frame AND were actually asked — a returning player who already left an address is let straight through, which is why it sits below DIED plus FINISHED.',
        }));
      }

      return h('section', { class: 'panel' },
        h('h2', { class: 'panel-title', text: 'Funnel' }),
        notes,
        bars,
      );
    }

    function depthPanel(o) {
      const depth = Array.isArray(o.depth) ? o.depth.slice().sort((a, b) => a.floor - b.floor) : [];
      const max = depth.reduce((m, d) => Math.max(m, d.sessions || 0), 0);
      const total = depth.reduce((t, d) => t + (d.sessions || 0), 0);

      const note = [
        o.avgFloor != null ? `mean ${o.avgFloor.toFixed(1)}` : null,
        o.medianFloor != null ? `median ${o.medianFloor}` : null,
      ].filter(Boolean).join(' · ');

      const bars = h('div', { class: 'bars' });
      const tip = makeTip(bars);
      for (const d of depth) {
        bars.appendChild(barRow(
          `Floor ${d.floor}`,
          d.sessions,
          max > 0 ? (100 * d.sessions) / max : 0,
          pctOf(d.sessions, total, 0),
          {
            tip,
            tipLabel: `Floor ${d.floor}`,
            tipValue: `${num(d.sessions)} sessions · ${pctOf(d.sessions, total, 0)} of runs`,
          },
        ));
      }

      return h('section', { class: 'panel' },
        h('div', { class: 'panel-head' },
          h('div', null,
            h('h2', { class: 'panel-title', text: 'Depth reached' }),
            h('p', { class: 'panel-note', text: 'Deepest floor per session — how far they actually got.' }),
          ),
          note ? h('div', { class: 'ctl-label', text: note }) : null,
        ),
        depth.length === 0 ? h('div', { class: 'empty', text: 'NO DEPTH DATA' }) : bars,
      );
    }

    /** Two stacked bar charts on one x-axis. Deliberately not a dual y-axis:
     *  sessions and signups differ by an order of magnitude and sharing a
     *  scale would flatten signups into the axis line. */
    function dailyPanel(o) {
      const daily = Array.isArray(o.daily) ? o.daily : [];
      const panel = h('section', { class: 'panel' },
        h('h2', { class: 'panel-title', text: 'Daily' }),
        h('p', { class: 'panel-note', text: 'Sessions and signups per day, oldest first. Separate scales — the peak of each row is labelled.' }),
      );
      if (daily.length === 0) {
        panel.appendChild(h('div', { class: 'empty', text: 'NO DAILY DATA' }));
        return panel;
      }

      const W = 960, PAD_L = 46, PAD_R = 8, ROW_H = 86, GAP = 18, AXIS = 16;
      const H = ROW_H * 2 + GAP + AXIS;
      const plotW = W - PAD_L - PAD_R;
      const step = plotW / daily.length;
      const barW = Math.max(1, Math.min(44, step * 0.7));

      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet', role: 'img',
        'aria-label': 'Daily sessions and signups' });

      const series = [
        { key: 'sessions', label: 'Sessions', cls: 'b-sessions', y0: 0 },
        { key: 'signups', label: 'Signups', cls: 'b-signups', y0: ROW_H + GAP },
      ];

      const chart = h('div', { class: 'chart' });
      const tip = makeTip(chart);
      /** viewBox units → rendered pixels. Read at hover time so a resized
       *  window can't leave the readout pointing at the wrong column. */
      const scale = () => (svg.clientWidth || W) / W;

      for (const ser of series) {
        const max = daily.reduce((m, d) => Math.max(m, d[ser.key] || 0), 0);
        const baseY = ser.y0 + ROW_H;
        svg.appendChild(s('line', { class: 'axis', x1: PAD_L, y1: baseY + 0.5, x2: W - PAD_R, y2: baseY + 0.5 }));
        svg.appendChild(s('text', { class: 'series-label', x: PAD_L, y: ser.y0 + 12, text: ser.label }));
        svg.appendChild(s('text', { x: PAD_L - 6, y: ser.y0 + 16, 'text-anchor': 'end', text: String(max) }));
        svg.appendChild(s('text', { x: PAD_L - 6, y: baseY, 'text-anchor': 'end', text: '0' }));

        const usable = ROW_H - 20;
        const bars = daily.map((d, i) => {
          const v = d[ser.key] || 0;
          const bh = max > 0 ? (v / max) * usable : 0;
          const x = PAD_L + i * step + (step - barW) / 2;
          const rect = s('rect', { class: ser.cls, x, y: baseY - bh, width: barW, height: Math.max(v > 0 ? 1 : 0, bh) });
          svg.appendChild(rect);
          return rect;
        });

        // A full-height transparent hit-rect per column, laid over the bars.
        // Without these, a quiet day (a one-pixel bar, or none at all) is
        // effectively unhoverable and the readout skips it.
        daily.forEach((d, i) => {
          const hit = s('rect', { class: 'hit', x: PAD_L + i * step, y: ser.y0, width: step, height: ROW_H });
          hit.addEventListener('mouseenter', () => {
            for (const el of chart.querySelectorAll('.hot')) el.classList.remove('hot');
            bars[i].classList.add('hot');
            const k = scale();
            const n = daily.length;
            // Flip the anchor near the ends so the readout never clips out.
            const anchor = i < n / 6 ? '0' : i > n - n / 6 ? '-100%' : '-50%';
            tip.show(
              (PAD_L + i * step + step / 2) * k,
              (ser.y0 + 2) * k,
              `translateX(${anchor})`,
              d.day,
              `${ser.label} ${num(d[ser.key] || 0)}`,
            );
          });
          svg.appendChild(hit);
        });
      }

      // x labels: first, middle, last only — anything denser is unreadable.
      const marks = daily.length <= 2 ? daily.map((_, i) => i) : [0, Math.floor(daily.length / 2), daily.length - 1];
      for (const i of marks) {
        const x = PAD_L + i * step + step / 2;
        svg.appendChild(s('text', {
          x, y: H - 3,
          'text-anchor': i === 0 ? 'start' : i === daily.length - 1 ? 'end' : 'middle',
          text: fmtDay(daily[i].day),
        }));
      }

      // The tip is already a child of `chart`; the svg goes in underneath it.
      chart.insertBefore(svg, chart.firstChild);
      panel.appendChild(chart);
      return panel;
    }

    function panelFailure(kind) {
      const [title, text] = FAILURE_TEXT[kind] || FAILURE_TEXT.bad;
      return h('div', { class: 'banner' }, h('b', { text: title }), h('span', { text }));
    }

    function sessionsPanel(rows) {
      const panel = h('section', { class: 'panel' },
        h('h2', { class: 'panel-title', text: 'Recent sessions' }),
        h('p', { class: 'panel-note', text: 'Newest first, most recent 50.' }),
      );
      if (!Array.isArray(rows)) { panel.appendChild(panelFailure('bad')); return panel; }
      if (rows.length === 0) { panel.appendChild(h('div', { class: 'empty', text: 'NO SESSIONS RECORDED' })); return panel; }

      const table = h('table', null,
        h('thead', null, h('tr', null,
          h('th', { text: 'Session' }),
          h('th', { text: 'First seen' }),
          h('th', { text: 'Last seen' }),
          h('th', { class: 'num', text: 'Floor' }),
          h('th', { class: 'num', text: 'Cmds' }),
          h('th', { class: 'num', text: 'Deaths' }),
          h('th', { text: 'Signed up' }),
          h('th', { class: 'fill' }),
        )),
        h('tbody', null, rows.map((r) => h('tr', null,
          h('td', { class: 'dim', title: r.session, text: String(r.session || '').slice(0, 10) || '—' }),
          h('td', { class: 'dim', text: fmtTs(r.firstSeen) }),
          h('td', { class: 'dim', text: fmtTs(r.lastSeen) }),
          h('td', { class: 'num', text: r.maxFloor == null ? '—' : String(r.maxFloor) }),
          h('td', { class: 'num', text: num(r.commands) }),
          h('td', { class: 'num', text: num(r.deaths) }),
          h('td', { text: r.signedUp ? '✓' : '·' }),
          h('td', { class: 'fill' }),
        ))),
      );
      panel.appendChild(h('div', { class: 'scroller' }, table));
      return panel;
    }

    function signupsPanel(rows, tok, o) {
      const csvBtn = h('button', { type: 'button', text: 'Download CSV', onclick: async () => {
        csvBtn.disabled = true;
        const label = csvBtn.textContent;
        csvBtn.textContent = 'Fetching…';
        try {
          // Needs the bearer header, so it cannot be a plain <a href> — fetch
          // the bytes and hand the browser a blob URL instead.
          const blob = await apiGet('/api/admin/wishlist.csv', tok, 'blob');
          const url = URL.createObjectURL(blob);
          const a = h('a', { href: url, download: `robot-operator-wishlist-${new Date().toISOString().slice(0, 10)}.csv` });
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          csvBtn.textContent = label;
        } catch (err) {
          const kind = err instanceof ApiError ? err.kind : 'unreachable';
          if (bounce(kind)) return;
          csvBtn.textContent = 'CSV failed';
        } finally {
          csvBtn.disabled = false;
        }
      } });

      // The tile above counts players who completed the gate; this table is what
      // survived the trip to Postgres. They are allowed to disagree — the gate
      // logs its event before the POST and the POST is fail-soft — so spell the
      // difference out rather than leaving two numbers looking contradictory.
      const entered = typeof o.signups === 'number' ? o.signups : null;
      const stored = typeof o.addressesStored === 'number' ? o.addressesStored : null;
      const lost = entered != null && stored != null ? Math.max(0, entered - stored) : null;

      const delivery = h('p', { class: `panel-note${lost ? ' warn' : ''}` });
      if (lost) {
        // "not stored" rather than "lost": the wishlist table is unique on
        // email, so this difference absorbs repeat addresses as well as POSTs
        // that never landed. Both are expected; neither is an error.
        delivery.textContent =
          `Last ${o.days} days: ${num(entered)} entered · ${num(stored)} rows in the database · ` +
          `${num(lost)} not stored — a repeat address, or a fail-soft save that never landed.`;
      } else if (entered && stored != null) {
        // Nothing to reconcile when nobody has signed up — the line would only
        // read as a stat where there is no stat.
        delivery.textContent = `Last ${o.days} days: ${num(entered)} entered · all of them reached the database.`;
      }

      const panel = h('section', { class: 'panel' },
        h('div', { class: 'panel-head' },
          h('div', null,
            h('h2', { class: 'panel-title', text: 'Wishlist signups' }),
            h('p', { class: 'panel-note', text: 'Rows in the database — all-time, newest first, most recent 200.' }),
            delivery,
          ),
          csvBtn,
        ),
      );

      if (!Array.isArray(rows)) { panel.appendChild(panelFailure('bad')); return panel; }
      if (rows.length === 0) {
        // "Nobody signed up" and "nobody's address survived" are different
        // stories, and the second one must not be reported as the first.
        panel.appendChild(h('div', { class: 'empty', text: entered ? 'NO ADDRESSES STORED' : 'NOBODY HAS SIGNED UP YET' }));
        return panel;
      }

      const table = h('table', null,
        h('thead', null, h('tr', null,
          h('th', { text: 'Email' }),
          h('th', { class: 'num', text: 'Floor' }),
          h('th', { text: 'Robot name' }),
          h('th', { text: 'When' }),
          h('th', { class: 'fill' }),
        )),
        h('tbody', null, rows.map((r) => h('tr', null,
          h('td', { class: 'email', title: r.email || '', text: r.email || '—' }),
          h('td', { class: 'num', text: r.floor == null ? '—' : String(r.floor) }),
          h('td', { class: 'dim', text: r.robotName || '—' }),
          h('td', { class: 'dim', text: fmtTs(r.createdAt) }),
          h('td', { class: 'fill' }),
        ))),
      );
      panel.appendChild(h('div', { class: 'scroller' }, table));
      return panel;
    }

    load();
  }

  // ------------------------------------------------------------------- boot

  const stored = readToken();
  if (!stored) {
    renderGate(null);
  } else {
    // Never trust what is in storage — prove it against the cheapest endpoint.
    apiGet('/api/admin/overview?days=1', stored).then(
      () => renderDashboard(stored),
      (err) => {
        const kind = err instanceof ApiError ? err.kind : 'unreachable';
        if (AUTHENTICATED_FAILURES.has(kind)) { renderDashboard(stored); return; }
        if (kind === 'unauthorized') clearToken();
        renderGate(kind);
      },
    );
  }
})();
</script>
</body>
</html>
